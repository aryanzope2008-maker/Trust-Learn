<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLearn: {% block title %}{% endblock %}</title>
<style>
:root{--ink:#12263a;--mist:#eef2f5;--card:#fff;--acc:#0e7c86;--mute:#5a6b7a;--line:#d8e0e6;--warn:#8a5a00;--warnbg:#fdf0d5;--bad:#a12626;--badbg:#fbe4e4}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--mist);color:var(--ink)}
header{background:var(--ink);padding:.7rem 1.2rem;display:flex;gap:1.4rem;align-items:baseline;flex-wrap:wrap}
header b{font:600 1.35rem Georgia,serif;color:#fff}
header a{color:#a9bccb;text-decoration:none;padding-bottom:2px}
header a.on{color:#fff;border-bottom:2px solid #5fd0d9}
header a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5fd0d9;outline-offset:2px}
header span{margin-left:auto;color:#a9bccb;font-size:.85rem}
main{max-width:920px;margin:1.4rem auto;padding:0 1rem}
h1{font:600 1.7rem Georgia,serif;margin:.2rem 0 .4rem}
h2{font:600 1.15rem Georgia,serif;margin:0 0 .5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem}
.mute{color:var(--mute);font-size:.92rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;padding:.05rem .55rem;border-radius:99px;font-size:.82rem;background:#dff1f3;color:#0a5a62}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:.4rem .85rem;font:inherit;cursor:pointer}
button.alt{background:#fff;color:var(--acc);border:1px solid var(--acc)}
input[type=text],select{font:inherit;padding:.4rem .5rem;border:1px solid #a9b8c4;border-radius:6px}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.flash{background:var(--warnbg);border:1px solid #e6c97a;padding:.55rem 1rem;border-radius:8px;margin-bottom:1rem}
.score{font:600 2.6rem Georgia,serif;color:var(--acc);line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:.5rem}
.bar i{display:block;height:8px;background:var(--acc);border-radius:4px}
.table-wrap{overflow-x:auto}
</style>
</head>
<body>
<header>
<b>TrustLearn</b>
<a href="{{ url_for('student') }}" class="{{ 'on' if request.endpoint == 'student' }}">Student</a>
<a href="{{ url_for('faculty') }}" class="{{ 'on' if request.endpoint == 'faculty' }}">Faculty</a>
<a href="{{ url_for('admin') }}" class="{{ 'on' if request.endpoint == 'admin' }}">Ethics panel</a>
<span>Prototype with synthetic data</span>
</header>
<main>
{% for m in get_flashed_messages() %}<div class="flash" role="status">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
